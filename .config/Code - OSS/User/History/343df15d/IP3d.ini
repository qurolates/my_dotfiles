[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
background = #282a36
foreground = #f8f8f2
font-0 = "JetBrainsMono Nerd Font"  ; Основной шрифт [web:1]
line-size = 2
padding-left = 2
padding-right = 2
modules-left = xworkspaces window
modules-right = cpu memory battery date

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = true
label-active = %name%
label-focused = %name%
label-occupied = %name%
label-urgent = %name%!
label-empty = %name%
label-separator = |
foreground = #bd93f9

[module/window]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = #f8f8f2
label-background = #44475a

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU "
label = %percentage%%
label-foreground = #8be9fd
label-background = #44475a

[module/memory]
type = internal/memory
interval = 2
format-prefix = " MEM "
label = %percentage_used%%
label-foreground = #50fa7b
label-background = #44475a

[module/battery]
type = internal/battery
battery = BAT1  ; Замените на ваше: ls /sys/class/power_supply/ [web:29]
adapter = AC
full-at = 99
low-at = 10
poll-interval = 5
ramp-capacity-0 =   ; Nerd Font иконки (0-20%)
ramp-capacity-1 =   ; 20-40%
ramp-capacity-2 =   ; 40-60%
ramp-capacity-3 =   ; 60-80%
ramp-capacity-4 =   ; 80-100%
label-charging = <ramp-capacity> CHR %percentage%%
label-discharging = <ramp-capacity> %percentage%%
label-full = <ramp-capacity> FULL
label-low = <ramp-capacity> LOW %percentage%%
label-foreground = #ffb86c  ; Dracula orange для battery
label-background = #44475a
format-charging-background = #44475a
format-discharging-background = #44475a [web:29]

[module/date]
type = internal/date
interval = 60
date = %d.%m.%Y
time = %H:%M
label = %date% %time%
label-foreground = #f8f8f2
label-background = #44475a
