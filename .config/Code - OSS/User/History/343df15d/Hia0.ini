[global/wm]
include-file = ~/.config/polybar/colors.ini  ; Создадим ниже

[bar/main]
width = 100%
height = 35
radius = 15
fixed-center = true
background = #282a3600  ; Прозрачный с blur
foreground = #f8f8f2
line-size = 2
border-size = 0
padding-left = 2
padding-right = 2
module-ma
font-0 = "JetBrainsMono Nerd Font:s"
font-1 = "JetBrainsMono Nerd Font:s"
font-2 = "Font Awesome 6 Free:s"
wm-restack = generic
enable-ipc = true
override-redirect = true
cursor-click = pointer
cursor-scroll = ns-resize
draw-shadow = false
shadow-size = 10
shadow-opacity = 0.3
blur-background = true  ; Для picom/compton

modules-left = xworkspaces
modules-center = window pulseaudio
modules-right = cpu memory net battery date

[module/xworkspaces]
type = internal/xworkspaces
enable-click = true
enable-scroll = true
all-desktops = true
label-active = %icon%
label-focused = %icon%
label-occupied = %icon%
label-urgent = %icon%!
label-empty = %icon%
ramp-0 = ①;②;③;④;⑤;⑥;⑦;⑧;⑨;⑩
foreground = #bd93f9
label-active-foreground = #ff79c6
label-active-background = linear-gradient(to right, #44475a, #bd93f9)
label-focused-background = #6272a455
label-padding = 4
label-active-padding = 6

[module/window]
type = internal/xwindow
label-font = 1
label =  %title:0:20:...%
label-foreground = #f8f8f2
label-background = linear-gradient(to right, #50fa7b, #00ff88)
label-padding = 4
animation = pulse 0.5

[module/cpu]
type = internal/cpu
interval = 1
format = <ramp-coreload> <label>
label = CPU %percentage%%
ramp-coreload-0 = ▁
ramp-coreload-4 = ▂
ramp-coreload-8 = ▃
ramp-coreload-12 = ▄
ramp-coreload-16 = ▅
ramp-coreload-20 = ▆
ramp-coreload-24 = ▇
ramp-coreload-32 = █
label-foreground = #ff79c6
label-background = #44475a
bar-fill = #8be9fd
bar-background = #6272a4
bar-width = 15
bar-padding = 1
bar-margin = 1

[module/memory]
type = internal/memory
interval = 1
format = <label>
label = MEM %percentage_used%%
label-foreground = #50fa7b
label-background = #44475a
bar-fill = #f1fa8c
bar-background = #6272a4
bar-width = 15
bar-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume> <bar-volume>
label-volume = %percentage%%
label-volume-foreground = #f1fa8c
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
bar-volume-width = 20
bar-volume-gradient = #f1fa8c;#ffb86c;#ff79c6;#ff5555
bar-volume-foreground-0 = #f1fa8c
bar-volume-foreground-1 = #ffb86c
label-muted = 󰝟 Muted
label-muted-foreground = #ff5555
format-background = #44475a
format-padding = 2

[module/net]
type = internal/network
interface = wlan0  ; Проверьте: ip link
interval = 5
label-connected = 󰖩 %local_ip%
label-disconnected = 󰖪 Offline
label-packetloss = 󰕳 %percentage%%
label-ethernet = 󰈀 %local_ip%
label-foreground = #8be9fd
format-background = #44475a

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh  ; Создайте скрипт из прошлого ответа
interval = 10
label-foreground = #ffb86c
format-background = #44475a
format-padding = 2

[module/date]
type = internal/date
interval = 1
date = %d %b
time = %H:%M
label = %date%  %time%
label-foreground = #f8f8f2
label-background = linear-gradient(to right, #bd93f9, #ff79c6)
label-padding = 4
