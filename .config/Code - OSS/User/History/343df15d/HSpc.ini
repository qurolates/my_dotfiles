[bar/main]
width = 100%
height = 30
radius = 9.0
fixed-center = true
background = #282a3680
foreground = #f8f8f2
line-size = 1
border-size = 2
border-color = #bd93f9
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = "JetBrainsMono Nerd Font"
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
modules-left = xworkspaces
modules-center = window
modules-right = cpu memory battery date

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
all-desktops = true
label-active = %name%
label-focused = %name%
label-occupied = %name%
label-urgent = %name%!
label-empty = %name%
label-active-background = #44475a
label-focused-background = #6272a4
label-occupied-background = #44475a
label-urgent-background = #ff5555
label-empty-background = #282a36
foreground = #f8f8f2

[module/window]
type = internal/xwindow
handle-unknown = ignore
label-font = 1
label = %title:0:25:...%
truncate = true
label-foreground = #f8f8f2
label-background = #44475a
label-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = #44475a
format-padding = 2
label = CPU %percentage:2%%
label-foreground = #8be9fd

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = #44475a
format-padding = 2
label = MEM %percentage_used:2%%
label-foreground = #50fa7b

[module/battery]
type = internal/battery
battery = BAT1  ; Ваша батарея
adapter = AC1    ; Адаптер (AC или AC0)
full-at = 98
time-format = %H:%M
low-at = 15
poll-interval = 10
ramp-capacity-0 =   ; 0-25% (nerd icon)
ramp-capacity-1 =   ; 25-50%
ramp-capacity-2 =   ; 50-75%
ramp-capacity-3 =   ; 75-100%
off-charging = false  ; Показывать при зарядке
label-charging = <ramp-capacity> %percentage%%
label-charging-foreground = #50fa7b  ; Зелёный при зарядке
label-discharging = <ramp-capacity> %percentage%%
label-full = <ramp-capacity> FULL
label-low = <ramp-capacity> LOW %percentage%%
label-low-foreground = #ff5555  ; Красный при низком
format-charging = <label>
format-discharging = <label>
format-background = #44475a
format-padding = 2
label-font = 0  ; Nerd font для иконок [web:29]

[module/date]
type = internal/date
interval = 60
date = %d.%m
time = %H:%M
locale = ru_RU.UTF-8
format = <label>
format-background = #44475a
format-padding = 2
label = %date% %time%
label-foreground = #f8f8f2
