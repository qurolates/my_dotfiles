[colors]
background = #282a36
foreground = #f8f8f2
color1 = #44475a
color2 = #6272a4
color3 = #bd93f9
color4 = #50fa7b
color5 = #f1fa8c
color6 = #ffb86c
color7 = #ff79c6
color8 = #8be9fd
color9 = #ff5555


[bar/main]
width = 100%
height = 28
radius = 0
background = #1e1f29
foreground = #cdd6f4
line-size = 1
border-size = 0
padding-left = 2
padding-right = 2
module-margin-left = 2  ; Увеличено расстояние модулей
module-margin-right = 2
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "DejaVu Sans Mono:size=10;2"
enable-ipc = true
modules-left = xworkspaces
modules-center = xwindow
modules-right = systray pulseaudio cpu memory battery date

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.color3}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = #89b4fa
label = %percentage%%
label-foreground = #cdd6f4

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = #a6e3a1
label = %gb_used%
label-foreground = #cdd6f4

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 30
format-prefix = "󰁹"
format-prefix-foreground = #f9e2af
label-foreground = #cdd6f4

[module/date]
type = internal/date
interval = 60
date-alt = %Y-%m-%d
time = %H:%M
label = %date% %time%
label-foreground = #cdd6f4

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
reverse-scroll = false
format-volume = <ramp-volume> <label-volume>
label-muted = 🔇 muted
label-muted-foreground = #666
ramp-volume-0 = 🔈
ramp-volume-1 = 🔉
ramp-volume-2 = 🔊
click-right = pavucontrol