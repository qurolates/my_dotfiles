[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
geometry = 0x0+0+0
background = #282a36
foreground = #f8f8f2
font-0 = "Sauce Code Pro Medium:size=10;0"
font-0-underline = #ff79c6
line-size = 2
padding-left = 2
padding-right = 2
modules-left = xworkspaces window
modules-center =
modules-right = cpu memory date

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
button-close = 0
label-active = %name%
label-focused = %name%
label-occupied = %name%
label-unknown = %name%
format = " %name% "
ws-icon-0 = 1
ws-icon-1 = 1
ws-scroll = true
index-sort = ascending
disable-scroll = false
border-width = 0
spacing = 2
foreground = #bd93f9
background = #44475a
colors =
active = #ff79c6
inactive = #6272a4

[module/window]
type = dock
label = %title%
hook-0 = xsetroot -solid #282a36
format = "  %title% "
label-empty =
label-foreground = #f8f8f2
label-background = #44475a

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU: "
label = "%percentage:3:0%%"
label-foreground = #8be9fd
label-background = #44475a
format =
; В Dracula palette можно использовать более мягкие оттенки
format-underline = #44475a

[module/memory]
type = internal/memory
interval = 2
label = "MEM: %used% / %total% MB (%percentused%%)"
label-foreground = #50fa7b
label-background = #44475a
format =

[module/date]
type = internal/date
interval = 60
date = " %Y-%m-%d "
time = " %H:%M "
label = "%date% %time%"
label-foreground = #f8f8f2
label-background = #44475a

; Категорически желательно задать стиль и формат bar.top/bottom если требуется
[bar/base]
inherit = bar/main
padding = 0

; Общие настройки цвета и палитры Dracula (пример)
[color]
base = #282a36
base-foreground = #f8f8f2
base-background = #44475a
bar = #44475a
light = #f8f8f2
dark = #22242a