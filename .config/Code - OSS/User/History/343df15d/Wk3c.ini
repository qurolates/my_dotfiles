[bar/main]
width = 100%
height = 30
radius = 9.0  ; Скруглённые углы
fixed-center = true
background = #282a3680  
foreground = #f8f8f2
line-size = 1
border-size = 2
border-color = #bd93f9
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = "JetBrainsMono Nerd Font"
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
modules-left = xworkspaces
modules-center = window
modules-right = cpu memory date

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
all-desktops = true
label-active = %name%
label-focused = %name%
label-occupied = %name%
label-urgent = %name%!
label-empty = %name%
label-active-background = #44475a
label-focused-background = #6272a4
label-occupied-background = #44475a
label-urgent-background = #ff5555
label-empty-background = #282a36
foreground = #f8f8f2

[module/window]
type = internal/xwindow
handle-unknown = ignore
label-font = 1  ; Mono для заголовка
label = %title:0:25:...%
truncate = true
label-foreground = #f8f8f2
label-background = #44475a
label-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = #44475a
format-padding = 2
label = CPU %percentage:2%%
label-foreground = #8be9fd

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = #44475a
format-padding = 2
label = MEM %percentage_used:2%%
label-foreground = #50fa7b

[module/date]
type = internal/date
interval = 60
date = %d.%m
time = %H:%M
locale = ru_RU.UTF-8
format = <label>
format-background = #44475a
format-padding = 2
label = %date% %time%
label-foreground = #f8f8f2
